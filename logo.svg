<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="守夜人 Nightwatcher">
  <defs>
    <radialGradient id="bg" cx="32%" cy="20%" r="95%">
      <stop offset="0" stop-color="#162E33"/>
      <stop offset="55%" stop-color="#0E1A1E"/>
      <stop offset="100%" stop-color="#070B0E"/>
    </radialGradient>
    <radialGradient id="moon" cx="34%" cy="26%" r="85%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#EAF8F4"/>
      <stop offset="72%" stop-color="#A9DED4"/>
      <stop offset="100%" stop-color="#5AA195"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="float" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#bg)"/>
  <rect x="0.2" y="0.2" width="31.6" height="31.6" rx="7.8" fill="none" stroke="#2DD4BF" stroke-opacity=".22" stroke-width="0.3"/>

  <!-- 守护细光环：缓慢旋转 -->
  <g filter="url(#glow)">
    <circle cx="16" cy="16" r="13.5" fill="none" stroke="url(#halo)" stroke-width="0.8" opacity=".6">
      <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 立体鼓月牙：上下浮动呼吸 -->
  <g filter="url(#float)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -0.8;0 0" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <path fill="url(#moon)" fill-rule="evenodd" d="M16 4.5a11.5 11.5 0 1 0 0 23 11.5 11.5 0 0 0 0-23z M19.2 3a8 8 0 1 1 0 16 8 8 0 0 1 0-16z"/>
      <ellipse cx="13" cy="10.5" rx="2.6" ry="3.4" fill="#FFFFFF" opacity=".55" filter="url(#glow)">
        <animate attributeName="opacity" values="0.55;0.22;0.55" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- 金色星：闪烁 -->
  <path d="M8.6 10.4l.9 2.2L11.7 13.5l-2.2.9L8.6 16.6l-.9-2.2L5.5 13.5l2.2-.9z" fill="#FFD98A" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
  </path>
</svg>
