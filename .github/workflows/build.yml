name: Build 守夜人 APK

permissions:
  contents: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor native
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build update bundle (zip + manifest)
        env:
          REPO: dkcoinlj/shouyeren-app
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p update
          (cd www && zip -r ../update/www.zip .)
          echo "{\"version\":\"$VER\",\"url\":\"https://raw.githubusercontent.com/$REPO/main/update/www.zip\"}" > update/update.json
          echo "bundle v$VER ready"

      - name: Commit update bundle
        run: |
          git config user.email "bot@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add update/www.zip update/update.json
          git commit -m "chore: update bundle v$(node -p "require('./package.json').version") [skip ci]" || echo "no changes"
          git push
